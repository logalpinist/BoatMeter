<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    position:fixed;
    left:10px;
    bottom:10px;
    z-index:9999;
    display:flex;
    gap:6px;
    align-items:center;
    padding:0;
    transform:scale(.75);
    transform-origin:bottom left;
}
    

    
.main{
    display:flex;
    width:100%;
    height:68vh;
}
    
.mapWrap{
    width:50%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#fileName{
    text-align:center;
    color:#00d4ff;
    font-size:12px;
    font-weight:700;
    padding:2px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#map{
    width:100%;
    flex:1;
}

.chartWrap{
    width:50%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#chart{
    width:100%;
    flex:1;
}

#infoPanel{
    text-align:center;
    color:#00d4ff;
    font-size:8px;
    font-weight:700;

    font-family:monospace;

    white-space:nowrap;
}
    
    #slider{
    width:90%;
    margin:4px auto;
}

#speedSelect,
#playBtn,
header button,
#fileLabel{
    width:72px;
    height:42px;
    border:1px solid #00d4ff;
    border-radius:10px;
    background:rgba(0,212,255,.08);
    color:#00d4ff;
    font-size:12px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    cursor:pointer;
}

    #speedSelect{
    text-align:center;
}
    
#infoBar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    padding:2px 0;
}

.rollText{
    color:#36a9e1;
}

.pitchText{
    color:#ff5f85;
}

.metric{

    display:inline-block;

    width:55px;

    text-align:right;

    font-family:monospace;
}
    
</style>
</head>

<body>

<header>
  <button onclick="goBack()">
    ← 戻る
</button>

<label for="csvFile" id="fileLabel">
    ファイル
</label>

<input
    type="file"
    id="csvFile"
    accept=".csv"
    hidden>   
    
    <select id="speedSelect" style="display:none;">

    <option value="500">0.5x</option>
    <option value="200" selected>1x</option>
    <option value="100">2x</option>
    <option value="50">4x</option>
    <option value="25">8x</option>
    <option value="12">16x</option>

</select>

<button
    id="playBtn"
    onclick="togglePlay()"
    style="display:none;">
    ▶
</button>
</header>

<div class="main">

    <div class="mapWrap">

        <div id="fileName">
            CSV未選択
        </div>

        <div id="map"></div>

    </div>

    <div class="chartWrap">
        <div id="infoBar">

  <div id="infoPanel">

<span class="metric">
0s
</span>

<span class="rollText metric">
R 0.0°
</span>

<span class="pitchText metric">
P 0.0°
</span>

<span class="metric">
T 0.0
</span>

<span class="metric">
0m
</span>

</div>
</div>

<canvas id="chart"></canvas>

<input
    type="range"
    id="slider"
    value="0"
    min="0"
    max="0">
        
    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
