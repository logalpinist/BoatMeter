<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    position:fixed;

    top:8px;
    right:8px;

    z-index:9999;

    display:flex;
    gap:4px;
    align-items:center;

    padding:0;

    transform:scale(.85);
    transform-origin:top right;
}    
header button{
    padding:8px 12px;
    border:1px solid rgba(0,0,0,.25);
    border-radius:10px;
    background:rgba(255,255,255,.65);
    color:#111;
    font-size:13px;
    font-weight:600;
    backdrop-filter:blur(12px);
}
    
input[type=file]{

    max-width:220px;

    color:white;
    font-size:12px;
}

input[type=file]::file-selector-button{

    padding:8px 12px;

    border:1px solid #666;

    border-radius:10px;

    background:
        rgba(255,255,255,.80);

    color:#111;

    font-size:13px;
    font-weight:600;

    backdrop-filter:blur(12px);

    margin-right:6px;
}
    
#map{
    width:100%;
    height:60vh;
}

#chart{
    width:100%;
    height:24vh !important;
}

#slider{
    width:90%;
    margin:8px auto;
}

</style>
</head>

<body>

<header>
    <button onclick="goBack()">
        ← 戻る
    </button>

    <input type="file" id="csvFile" accept=".csv">
</header>

<div id="map"></div>

<canvas id="chart"></canvas>

<input type="range" id="slider" value="0" min="0" max="0">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
