<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    position:fixed;

    left:10px;
    bottom:10px;

    z-index:9999;

    display:flex;
    gap:6px;
    align-items:center;

    padding:0;

    transform:scale(.75);
    transform-origin:bottom left;
}
    
header button,
input[type=file]::file-selector-button{

    padding:8px 12px;

    border:1px solid #00d4ff;

    border-radius:10px;

    background:
        rgba(0,212,255,.08);

    color:#00d4ff;

    font-size:13px;
    font-weight:600;

    backdrop-filter:blur(10px);
}
    
input[type=file]{

    max-width:220px;

    color:white;
    font-size:12px;
}

    
.main{
    display:flex;
    width:100%;
    height:72vh;
}

#map{
    width:50%;
    height:100%;
}

.chartWrap{
    width:50%;
    height:100%;
    display:flex;
    flex-direction:column;
}

#chart{
    width:100%;
    flex:1;
}
    
    input[type=file]::file-selector-button{
    margin-right:6px;
}

#infoPanel{

    width:100%;

    text-align:center;

    color:#00d4ff;

    font-size:12px;

    font-weight:700;

    padding:2px 0;

    box-sizing:border-box;
}
    
#slider{
    width:90%;
    margin:4px auto;
}

#playBtn{
    align-self:center;
    margin:2px 0 4px;
    padding:6px 14px;
    border:1px solid #00d4ff;
    border-radius:10px;
    background:rgba(0,212,255,.08);
    color:#00d4ff;
    font-size:13px;
    font-weight:600;
}
    
</style>
</head>

<body>

<header>
    <button onclick="goBack()">
        ← 戻る
    </button>

    <input type="file" id="csvFile" accept=".csv">
</header>

<div class="main">

    <div id="map"></div>

    <div class="chartWrap">

        <div id="infoPanel">
            TIME 0s　ROLL 0°　PITCH 0°
        </div>

<button id="playBtn" onclick="togglePlay()">
    ▶ 再生
</button>
        
        <canvas id="chart"></canvas>

        <input
            type="range"
            id="slider"
            value="0"
            min="0"
            max="0">

    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
