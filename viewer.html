<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    position:fixed;

    top:4px;
    right:-30px;

    z-index:9999;

    display:flex;
    gap:4px;
    align-items:center;

    padding:0;

    transform:scale(.65);
    transform-origin:top right;
} 
    
header button,
input[type=file]::file-selector-button{

    padding:8px 12px;

    border:1px solid rgba(0,0,0,.25);

    border-radius:10px;

    background:
        rgba(255,255,255,.65);

    color:#111;

    font-size:13px;
    font-weight:600;

    backdrop-filter:blur(12px);
}
    
input[type=file]{

    max-width:220px;

    color:white;
    font-size:12px;
}

    
.main{
    display:flex;
    width:100%;
    height:82vh;
}

#map{
    width:50%;
    height:100%;
}

.chartWrap{
    width:50%;
    height:100%;
}

#chart{
    width:100%;
    height:100% !important;
}

#slider{
    display:block;
    width:88%;
    margin:10px auto;
}    
input[type=file]::file-selector-button{
    margin-right:6px;
}
    
</style>
</head>

<body>

<header>
    <button onclick="goBack()">
        ← 戻る
    </button>

    <input type="file" id="csvFile" accept=".csv">
</header>

<div class="main">

    <div id="map"></div>

    <div class="chartWrap">
        <canvas id="chart"></canvas>
    </div>

</div>

<input type="range" id="slider" value="0" min="0" max="0">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
