<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    position:fixed;
    top:8px;
    left:8px;
    z-index:9999;

    height:auto;
    padding:0;

    display:flex;
    align-items:center;
    gap:6px;
}

header button,
input[type=file]::file-selector-button{
    padding:8px 12px;
    border:1px solid #00d4ff;
    border-radius:10px;
    background:rgba(0,212,255,.08);
    color:#00d4ff;
    font-size:13px;
    backdrop-filter:blur(10px);
}

input[type=file]{
    max-width:210px;
    color:white;
    font-size:12px;
}

#map{
    width:100%;
    height:58vh;
}

#chart{
    display:block;
    width:100%;
    height:30vh !important;
}

#slider{
    display:block;
    width:90%;
    margin:8px auto;
}    input[type=file]{
    max-width:220px;
    color:white;
    font-size:12px;
}

header button{
    padding:6px 10px;
    font-size:12px;
}
    
</style>
</head>

<body>

<header>
    <button onclick="goBack()">
        ← 戻る
    </button>

    <input type="file" id="csvFile" accept=".csv">
</header>

<div id="map"></div>

<canvas id="chart"></canvas>

<input type="range" id="slider" value="0" min="0" max="0">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
