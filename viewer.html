<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoatMeter Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>
body{
    margin:0;
    background:#07121f;
    color:white;
    font-family:sans-serif;
    overflow:hidden;
}

header{
    height:48px;
    padding:6px;
    box-sizing:border-box;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
}

#map{
    width:100%;
    height:42vh;
}

#chart{
    display:block;
    width:100%;
    height:30vh !important;
}

#slider{
    display:block;
    width:86%;
    margin:14px auto 4px;
}

    input[type=file]{
    max-width:220px;
    color:white;
    font-size:12px;
}

header button{
    padding:6px 10px;
    font-size:12px;
}
    
</style>
</head>

<body>

<header>
    <button onclick="goBack()">
        ← 戻る
    </button>

    <input type="file" id="csvFile" accept=".csv">
</header>

<div id="map"></div>

<canvas id="chart" height="160"></canvas>

<input type="range" id="slider" value="0" min="0" max="0">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="viewer.js"></script>

</body>
</html>
