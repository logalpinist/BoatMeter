<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slope Meter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ROLL -->
    <div class="gauge">
        <h2>ROLL</h2>

        <div class="dial">
            <div class="sea"></div>

            <div class="boatWrap" id="rollBoat">
                <img src="ponam-rear.png">
            </div>

        </div>

        <div class="angle" id="rollValue">0°</div>
    </div>

    <!-- PITCH -->
    <div class="gauge">
        <h2>PITCH</h2>

        <div class="dial">
            <div class="sea"></div>

            <div class="boatWrap" id="pitchBoat">
                <img src="ponam-side.png">
            </div>

        </div>

        <div class="angle" id="pitchValue">0°</div>
    </div>

</div>

<div class="controls">
    <button onclick="requestPermission()">開始</button>
    <button onclick="resetZero()">リセット</button>
</div>

<script src="app.js"></script>

</body>
</html>
