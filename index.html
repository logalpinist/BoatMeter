<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat Meter</title>

<link rel="stylesheet" href="style.css">
</head>

<body>
<button onclick="requestPermission()">
    センサー開始
</button>
<div class="container">

    <div class="gauge">
        <h2>ROLL</h2>

        <div class="sea"></div>

        <div class="boat" id="rollBoat">
            🚤
        </div>

        <div class="angle" id="rollValue">
            0°
        </div>
    </div>

    <div class="gauge">
        <h2>PITCH</h2>

        <div class="sea"></div>

        <div class="boat" id="pitchBoat">
            🚤
        </div>

        <div class="angle" id="pitchValue">
            0°
        </div>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
