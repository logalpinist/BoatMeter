<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat HUD</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ROLL -->
    <div class="gauge">

        <h2>ROLL</h2>

        <div class="dial">
            <div class="ticks"></div>
            <div class="marker" id="rollMarker"></div>

            <div class="boatWrap" id="rollBoat">
                <img src="ponam-rear.png">
            </div>
        </div>

        <div class="angleBig" id="rollValue">0°</div>

        <button onclick="requestPermission()">センサー開始</button>
        <button onclick="resetZero()">ゼロ</button>

    </div>

    <!-- PITCH -->
    <div class="gauge">

        <h2>PITCH</h2>

        <div class="dial">
            <div class="ticks"></div>
            <div class="marker" id="pitchMarker"></div>

            <div class="boatWrap" id="pitchBoat">
                <img src="ponam-side.png">
            </div>
        </div>

        <div class="angleBig" id="pitchValue">0°</div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
