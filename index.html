<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boat Meter</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <button onclick="requestPermission()">
        センサー開始
    </button>

    <button onclick="resetZero()">
        リセット
    </button>

    <div class="card">

        <h2>ROLL</h2>

        <div class="box">

            <img
                id="rollBoat"
                src="boat.png"
                alt="boat">

        </div>

        <div id="rollValue" class="value">
            0.0°
        </div>

    </div>

    <div class="card">

        <h2>PITCH</h2>

        <div class="box">

            <img
                id="pitchBoat"
                src="boat.png"
                alt="boat">

        </div>

        <div id="pitchValue" class="value">
            0.0°
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
