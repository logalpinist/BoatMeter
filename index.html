<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slope Meter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="meter">
        <div class="title">ROLL</div>

        <div class="valueRow">
            <div class="value" id="rollValue">0°</div>
        </div>

        <div class="box">
            <img id="rollBoat" src="ponam-rear.png">
        </div>
    </div>

    <div class="meter">
        <div class="title">PITCH</div>

        <div class="valueRow">
            <div class="value" id="pitchValue">0°</div>
        </div>

        <div class="box">
            <img id="pitchBoat" src="ponam-side.png">
        </div>
    </div>

</div>

<div class="controls">
    <button onclick="startSensor()">開始</button>
    <button onclick="resetZero()">リセット</button>
</div>

<script src="app.js"></script>

</body>
</html>
