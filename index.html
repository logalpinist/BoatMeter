<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat Meter</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <button class="startBtn" onclick="requestPermission()">
        センサー開始
    </button>

    <button class="resetBtn" onclick="resetZero()">
        リセット
    </button>

    <div class="boatArea">

        <div class="boat" id="boat">
            ⛵
        </div>

    </div>

    <div class="meters">

        <div class="meter">
            <h2>ROLL</h2>
            <div id="rollValue">0.0°</div>
        </div>

        <div class="meter">
            <h2>PITCH</h2>
            <div id="pitchValue">0.0°</div>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
