<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Boat Meter</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="rotateMessage">
    横向きにしてください
</div>

<div id="app">

    <div class="topBar">
        <button onclick="requestPermission()">
            センサー開始
        </button>

        <button onclick="resetLevel()">
            リセット
        </button>
    </div>

    <div class="gauges">

        <!-- ROLL -->

        <div class="gauge">

            <div class="window">

                <div id="rollBoat" class="boat">
                    ⛵
                </div>

            </div>

            <div class="value">
                ROLL
                <span id="rollValue">0.0</span>°
            </div>

        </div>

        <!-- PITCH -->

        <div class="gauge">

            <div class="window">

                <div id="pitchBoat" class="pitch-boat">
                    ⛵
                </div>

            </div>

            <div class="value">
                PITCH
                <span id="pitchValue">0.0</span>°
            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
