<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boat Slope Meter</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ROLL -->

    <div class="meter">

        <div class="title">ROLL</div>

        <div class="valueRow">
            <div class="value" id="rollValue">0°</div>
        </div>

        <div class="box">

            <div class="gauge">

                <div class="waterLine"></div>

                <div class="mark left20">20</div>
                <div class="mark left10">10</div>

                <div class="mark right10">10</div>
                <div class="mark right20">20</div>

                <img
                    id="rollBoat"
                    src="ponam-rear.png"
                    alt="Roll Boat"
                >

            </div>

        </div>

    </div>

    <!-- CENTER LOGO -->

    <div class="logo">
        ⚓
    </div>

    <!-- PITCH -->

    <div class="meter">

        <div class="title">PITCH</div>

        <div class="valueRow">
            <div class="value" id="pitchValue">0°</div>
        </div>

        <div class="box">

            <div class="gauge">

                <div class="waterLine"></div>

                <div class="mark left20">20</div>
                <div class="mark left10">10</div>

                <div class="mark right10">10</div>
                <div class="mark right20">20</div>

                <img
                    id="pitchBoat"
                    src="ponam-side.png"
                    alt="Pitch Boat"
                >

            </div>

        </div>

    </div>

</div>

<div class="controls">

    <button onclick="startSensor()">
        開始
    </button>

    <button onclick="resetZero()">
        リセット
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
